<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpectroGuard — Live Streams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070d;
    --panel: rgba(12,16,34,0.55);
    --panel-solid: #0b0f22;
    --panel-border: rgba(120,160,255,0.22);
    --blue:#4da3ff;
    --violet:#9b6bff;
    --cyan:#3fe0d6;
    --amber:#f2a93c;
    --danger:#ef5b5b;
    --text-primary:#eef1fa;
    --text-muted:#8890ac;
    --text-faint:#535a75;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    background:var(--void);
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
  }
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(77,163,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(155,107,255,0.08), transparent 60%);
    background-attachment:fixed;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:20px;
    padding:14px 26px;
    background:rgba(6,8,18,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--panel-border);
  }
  .mark{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .mark-glyph{ width:24px; height:24px; }
  .mark-text{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; }
  .mark-text span{ color:var(--blue); }

  .search{
    flex:1; max-width:360px;
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:3px;
    padding:8px 12px;
  }
  .search input{
    background:none; border:none; outline:none;
    color:var(--text-primary); font-size:13px; width:100%;
    font-family:'Inter',sans-serif;
  }
  .search input::placeholder{ color:var(--text-faint); }
  .search svg{ width:15px; height:15px; flex-shrink:0; opacity:0.5; }

  .topbar-right{
    margin-left:auto;
    display:flex; align-items:center; gap:22px;
  }
  .clock{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:0.06em;
    color:var(--text-faint);
  }
  .bell{
    position:relative; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,0.08); border-radius:3px;
    cursor:pointer;
  }
  .bell svg{ width:16px; height:16px; opacity:0.8; }
  .bell .badge{
    position:absolute; top:-5px; right:-5px;
    background:var(--danger); color:#2a0808;
    font-family:'JetBrains Mono',monospace; font-weight:600;
    font-size:9.5px; padding:1px 4px; border-radius:8px;
    line-height:1.4;
  }
  .operator{ display:flex; align-items:center; gap:9px; }
  .op-avatar{
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:11px; color:#04070f;
  }
  .op-meta{ line-height:1.3; }
  .op-name{ font-size:12.5px; font-weight:500; }
  .op-role{ font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; }

  /* ---------- layout ---------- */
  .layout{ display:flex; min-height:calc(100vh - 61px); }

  .sidebar{
    width:220px; flex-shrink:0;
    padding:20px 14px;
    border-right:1px solid var(--panel-border);
  }
  .side-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-faint);
    margin:0 8px 10px;
  }
  .zone-list{ list-style:none; margin:0 0 26px; padding:0; }
  .zone-list li{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; border-radius:3px; font-size:13px;
    cursor:pointer; color:var(--text-muted);
    transition:background 0.12s ease, color 0.12s ease;
  }
  .zone-list li:hover{ background:rgba(255,255,255,0.04); color:var(--text-primary); }
  .zone-list li.active{ background:rgba(77,163,255,0.1); color:var(--text-primary); }
  .zone-list li span.count{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint);
  }

  .health-card{
    background:var(--panel-solid);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:14px;
  }
  .health-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .health-row:last-child{ border-bottom:none; }
  .health-row .lbl{ color:var(--text-muted); }
  .health-row .val{ font-family:'JetBrains Mono',monospace; color:var(--cyan); font-size:11.5px; }
  .dot-ok{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan); display:inline-block; margin-right:6px; }

  .main{ flex:1; padding:22px 26px 40px; min-width:0; }

  .main-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .main-head h1{
    font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:20px; margin:0;
  }
  .main-head .sub{ font-size:12.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; }

  /* ---------- ticker ---------- */
  .ticker-wrap{
    overflow:hidden; margin-bottom:20px;
    border:1px solid var(--panel-border); border-radius:5px;
    background:var(--panel-solid);
    padding:10px 0;
  }
  .ticker-track{
    display:flex; gap:34px; width:max-content;
    animation:scrollTicker 32s linear infinite;
  }
  @keyframes scrollTicker{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .ticker-item{
    display:flex; align-items:center; gap:9px;
    font-size:12px; color:var(--text-muted);
    white-space:nowrap; padding:0 18px;
    border-left:2px solid var(--text-faint);
  }
  .ticker-item.sev-warn{ border-left-color:var(--amber); }
  .ticker-item.sev-alarm{ border-left-color:var(--danger); }
  .ticker-item b{ color:var(--text-primary); font-weight:500; }
  .ticker-item .t{ font-family:'JetBrains Mono',monospace; color:var(--text-faint); font-size:10.5px; }

  /* ---------- camera grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:16px;
  }
  .tile{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    aspect-ratio:16/10;
    border:1px solid var(--panel-border);
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tile:hover{ transform:translateY(-2px); border-color:rgba(120,160,255,0.4); }
  .tile.selected{
    border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(77,163,255,0.25), 0 0 30px rgba(77,163,255,0.15);
  }
  .tile.sev-warn{ border-color:rgba(242,169,60,0.5); }
  .tile.sev-alarm{ border-color:rgba(239,91,91,0.6); }

  .feed{
    position:absolute; inset:0;
    background-size:220% 220%;
    animation:drift 14s ease-in-out infinite;
    filter:saturate(0.75) brightness(0.75);
  }
  @keyframes drift{
    0%{ background-position:0% 0%; }
    50%{ background-position:100% 60%; }
    100%{ background-position:0% 0%; }
  }
  .feed::after{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, transparent 2px, transparent 4px);
    mix-blend-mode:overlay;
  }
  .tile-shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 22%, transparent 68%, rgba(0,0,0,0.7) 100%);
  }

  .tile-top{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 11px;
  }
  .tile-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#f2f4fb;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .tile-label .zone{ color:var(--text-faint); }
  .status-chip{
    display:flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.06em;
    padding:2px 7px; border-radius:8px;
    background:rgba(0,0,0,0.5);
  }
  .status-chip .d{ width:5px; height:5px; border-radius:50%; background:var(--cyan); box-shadow:0 0 5px var(--cyan); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .status-chip.rec .d{ background:var(--danger); box-shadow:0 0 5px var(--danger); }

  .tile-bottom{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:9px 11px;
  }
  .tile-time{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:rgba(238,241,250,0.75);
  }
  .tile-note{
    font-size:10.5px; padding:2px 7px; border-radius:3px;
    background:rgba(0,0,0,0.5);
    color:var(--text-muted);
  }
  .tile-note.warn{ color:var(--amber); }
  .tile-note.alarm{ color:var(--danger); }

  @media (max-width:860px){
    .sidebar{ display:none; }
    .topbar{ gap:12px; padding:12px 16px; }
    .search{ max-width:none; }
    .op-meta{ display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">
    <svg class="mark-glyph" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14.5" stroke="url(#g1)" stroke-width="1.4"/>
      <circle cx="16" cy="16" r="9" stroke="url(#g1)" stroke-width="1.1" opacity="0.7"/>
      <circle cx="16" cy="16" r="2.6" fill="#4da3ff"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32">
          <stop offset="0" stop-color="#4da3ff"/>
          <stop offset="1" stop-color="#9b6bff"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="mark-text">Spectro<span>Guard</span></div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="filter-input" type="text" placeholder="Filter cameras by name or zone…">
  </div>

  <div class="topbar-right">
    <div class="clock" id="clock">00:00:00 UTC</div>
    <div class="bell" title="Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span class="badge">3</span>
    </div>
    <div class="operator">
      <div class="op-avatar">JR</div>
      <div class="op-meta">
        <div class="op-name">J. Ruiz</div>
        <div class="op-role">SOC-014 · TIER 2</div>
      </div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <p class="side-label">Zones</p>
    <ul class="zone-list" id="zone-list">
      <li class="active" data-zone="all">All cameras <span class="count">12</span></li>
      <li data-zone="perimeter">Perimeter <span class="count">4</span></li>
      <li data-zone="lobby">Lobby &amp; entry <span class="count">2</span></li>
      <li data-zone="warehouse">Warehouse <span class="count">3</span></li>
      <li data-zone="parking">Parking <span class="count">3</span></li>
    </ul>

    <p class="side-label">System health</p>
    <div class="health-card">
      <div class="health-row"><span class="lbl"><span class="dot-ok"></span>Workers</span><span class="val">8 / 8</span></div>
      <div class="health-row"><span class="lbl">Ingest latency</span><span class="val">142 ms</span></div>
      <div class="health-row"><span class="lbl">Model version</span><span class="val">v2.4.1</span></div>
      <div class="health-row"><span class="lbl">Uptime</span><span class="val">14d 6h</span></div>
    </div>
  </div>

  <div class="main">
    <div class="main-head">
      <h1>Live streams</h1>
      <span class="sub">12 CAMERAS · 3 ACTIVE ALERTS</span>
    </div>

    <div class="ticker-wrap">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <div class="grid" id="camera-grid"></div>
  </div>
</div>

<script>
  function tick(){
    document.getElementById('clock').textContent = new Date().toISOString().substr(11,8) + ' UTC';
  }
  tick(); setInterval(tick, 1000);

  const gradients = [
    'linear-gradient(120deg, #142238, #1c2b4a, #101a2c)',
    'linear-gradient(120deg, #16243a, #23375a, #131f34)',
    'linear-gradient(120deg, #101c30, #1a2740, #0d1626)',
    'linear-gradient(120deg, #182a44, #223a5e, #121e33)'
  ];

  const cameras = [
    { id:'CAM-01', zone:'perimeter', name:'North fence',     rec:true,  sev:'ok',    note:'no anomalies' },
    { id:'CAM-02', zone:'perimeter', name:'East fence',      rec:false, sev:'ok',    note:'no anomalies' },
    { id:'CAM-03', zone:'perimeter', name:'South gate',      rec:true,  sev:'warn',  note:'motion — review' },
    { id:'CAM-04', zone:'perimeter', name:'West service rd', rec:false, sev:'ok',    note:'no anomalies' },
    { id:'CAM-05', zone:'lobby',     name:'Main entrance',   rec:true,  sev:'ok',    note:'no anomalies' },
    { id:'CAM-06', zone:'lobby',     name:'Reception desk',  rec:false, sev:'ok',    note:'no anomalies' },
    { id:'CAM-07', zone:'warehouse', name:'Bay 3 loading',   rec:true,  sev:'alarm', note:'intrusion flagged' },
    { id:'CAM-08', zone:'warehouse', name:'Bay 7 storage',   rec:false, sev:'ok',    note:'no anomalies' },
    { id:'CAM-09', zone:'warehouse', name:'Mezzanine',       rec:true,  sev:'ok',    note:'no anomalies' },
    { id:'CAM-10', zone:'parking',   name:'Lot A',           rec:false, sev:'ok',    note:'no anomalies' },
    { id:'CAM-11', zone:'parking',   name:'Lot B',           rec:true,  sev:'ok',    note:'no anomalies' },
    { id:'CAM-12', zone:'parking',   name:'Garage ramp',     rec:false, sev:'warn',  note:'low light' },
  ];

  const grid = document.getElementById('camera-grid');

  function renderGrid(filterText, zone){
    grid.innerHTML = '';
    const q = (filterText || '').toLowerCase().trim();
    cameras
      .filter(c => zone === 'all' || c.zone === zone)
      .filter(c => !q || c.name.toLowerCase().includes(q) || c.zone.includes(q) || c.id.toLowerCase().includes(q))
      .forEach((c, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile' + (c.sev === 'warn' ? ' sev-warn' : c.sev === 'alarm' ? ' sev-alarm' : '');
        const secsAgo = Math.floor(Math.random() * 8);
        tile.innerHTML = `
          <div class="feed" style="background-image:${gradients[i % gradients.length]}; animation-duration:${12 + (i%5)*2}s;"></div>
          <div class="tile-shade"></div>
          <div class="tile-top">
            <span class="tile-label">${c.id} <span class="zone">· ${c.name}</span></span>
            <span class="status-chip ${c.rec ? 'rec' : ''}"><span class="d"></span>${c.rec ? 'REC' : 'LIVE'}</span>
          </div>
          <div class="tile-bottom">
            <span class="tile-time">00:00:${String(secsAgo).padStart(2,'0')} ago</span>
            <span class="tile-note ${c.sev === 'warn' ? 'warn' : c.sev === 'alarm' ? 'alarm' : ''}">${c.note}</span>
          </div>
        `;
        tile.addEventListener('click', () => {
          document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
          tile.classList.add('selected');
        });
        grid.appendChild(tile);
      });
  }

  let activeZone = 'all';
  renderGrid('', activeZone);

  document.getElementById('filter-input').addEventListener('input', (e) => {
    renderGrid(e.target.value, activeZone);
  });

  document.getElementById('zone-list').addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if(!li) return;
    document.querySelectorAll('.zone-list li').forEach(l => l.classList.remove('active'));
    li.classList.add('active');
    activeZone = li.dataset.zone;
    renderGrid(document.getElementById('filter-input').value, activeZone);
  });

  // alert ticker (duplicated for seamless loop)
  const alerts = [
    { sev:'alarm', cam:'CAM-07', msg:'Intrusion flagged — Bay 3 loading', t:'00:00:12' },
    { sev:'warn',  cam:'CAM-03', msg:'Motion — review requested', t:'00:02:41' },
    { sev:'warn',  cam:'CAM-12', msg:'Low light — confidence reduced', t:'00:05:03' },
    { sev:'ok',    cam:'CAM-09', msg:'Worker restart completed cleanly', t:'00:09:57' },
  ];
  const track = document.getElementById('ticker-track');
  function buildTicker(){
    let html = '';
    for(let rep = 0; rep < 2; rep++){
      alerts.forEach(a => {
        html += `<div class="ticker-item sev-${a.sev}"><b>${a.cam}</b>&nbsp;${a.msg}<span class="t">&nbsp;${a.t}</span></div>`;
      });
    }
    track.innerHTML = html;
  }
  buildTicker();
</script>
</body>
</html>
